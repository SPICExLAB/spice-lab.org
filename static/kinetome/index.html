<title>SPICE Lab</title>
<style>
:root { color-scheme: light; --page: #f9f9f7; --surface: #ffffff; --ink: #0b0b0b; --ink2: #52514e;
  --border: rgba(11,11,11,.14); --accent: #2a78d6; --error: #b3261e; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7;
    --border: rgba(255,255,255,.16); --accent: #3987e5; --error: #f2b8b5; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; }
h1 { font-size: 18px; line-height: 1.3; margin: 0 0 16px; font-weight: 650; }
label { display: block; font-size: 13px; color: var(--ink2); margin-bottom: 6px; }
input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
  background: transparent; color: inherit; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 9px 11px; border: 0;
  border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button[disabled] { opacity: .6; cursor: default; }
#message { min-height: 1.45em; margin: 10px 0 0; font-size: 13px; color: var(--error); }
</style>

// The page content is AES-256-GCM ciphertext. The key is derived from the
// password with PBKDF2-SHA256; a wrong password fails the GCM check.
async function decryptPayload(payload, password) {
  const bytes = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(payload.salt), iterations: payload.iter, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.ct));
  return new TextDecoder().decode(plain);
}

    event.preventDefault();
    if (!window.crypto || !crypto.subtle) {
      message.textContent = "This browser cannot open the page. Use a current browser over https.";
      return;
    }
    button.disabled = true;
    message.textContent = "";
    button.textContent = "Checking…";
    decryptPayload(payload, input.value.trim()).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    }).catch(function () {
      button.disabled = false;
      button.textContent = "Open";
      message.textContent = "Wrong password.";
      input.select();
    });
  });
})();
</script>
</body>
</html>
